services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ebook
      MYSQL_USER: ebook
      MYSQL_PASSWORD: ebook
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  php:
    build: ./docker/php
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_URL: http://localhost:${HTTP_PORT:-8080}
      HTTP_PORT: ${HTTP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ebook
      DB_USERNAME: ebook
      DB_PASSWORD: ebook
      EBOOK_PATH: /var/www/html/storage/app/private/ebook.pdf
      NGROK_API_URL: http://host.docker.internal:4040
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./docker/nginx
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - php
    restart: unless-stopped

  ngrok:
    profiles: ["docker-ngrok"]
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - http
      - http://web:80
      - --log=stdout
      - --host-header=rewrite
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - web

volumes:
  mysql_data:
